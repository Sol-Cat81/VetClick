<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vet Click · Panel administrativo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">VC</div>
      <div>
        <strong>Vet Click</strong>
        <span>Panel administrativo</span>
      </div>
    </div>

    <nav class="side-nav" aria-label="Navegación principal">
      <a href="#dashboard" class="nav-item active" data-view="dashboard">
        <span class="nav-icon">⌂</span><span>Dashboard</span>
      </a>
      <a href="#clientes" class="nav-item" data-view="clientes">
        <span class="nav-icon">◉</span><span>Clientes</span>
      </a>
      <a href="#clinica" class="nav-item" data-view="clinica">
        <span class="nav-icon">✚</span><span>Clínica</span>
      </a>
      <a href="#catalogo" class="nav-item" data-view="catalogo">
        <span class="nav-icon">▦</span><span>Catálogo</span>
      </a>
      <a href="#inventario" class="nav-item" data-view="inventario">
        <span class="nav-icon">▤</span><span>Inventario</span>
      </a>
      <a href="#ventas" class="nav-item" data-view="ventas">
        <span class="nav-icon">▣</span><span>Ventas</span>
      </a>
      <a href="#personal" class="nav-item" data-view="personal">
        <span class="nav-icon">♙</span><span>Personal y seguridad</span>
      </a>
    </nav>

    <button class="logout-btn" id="logoutBtn">
      <span>↪</span> Cerrar sesión
    </button>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div class="search-box">
        <span>⌕</span>
        <input type="search" placeholder="Buscar paciente, cliente, cita..." aria-label="Buscar">
      </div>
      <div class="user-menu">
        <div class="user-copy">
          <strong>Administrador</strong>
          <span>Administrador del sistema</span>
        </div>
        <div class="avatar">AD</div>
      </div>
    </header>

    <main id="app-content" class="main-content" aria-live="polite"></main>
  </div>

  <!-- Modal único de detalle, compartido por todas las vistas. Vive en el shell
       y no en las vistas porque app.js es genérico y las vistas se recargan. -->
  <div class="modal-backdrop" id="modal-detalle" data-admin-modal="detalle">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detalle-titulo">
      <div class="modal-head">
        <div><span class="modal-kicker">Detalle del registro</span>
          <h2 id="detalle-titulo" data-detalle-titulo>Detalle</h2>
        </div>
        <button class="modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
      </div>
      <div class="detail-grid" data-detalle-campos></div>
      <!-- Los bloques con tabla (lineas de un pedido, pagos, envios) van aparte
           del .detail-grid porque ese es de tres columnas y una tabla no entra. -->
      <div data-detalle-listas></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" data-modal-close>Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal reutilizable de confirmación de borrado. Vive en el shell, y no en
       una vista, porque lo van a usar todas las secciones a medida que se
       conecten su DELETE. No lleva <form> a proposito: el handler generico de
       submit de app.js interceptaria el envio y cerraria el modal. -->
  <div class="modal-backdrop" data-admin-modal="confirmar-borrado">
    <div class="modal modal-confirmar" role="alertdialog" aria-modal="true"
      aria-labelledby="confirmar-borrado-titulo" aria-describedby="confirmar-borrado-detalle">
      <div class="modal-head">
        <div><span class="modal-kicker">Acción irreversible</span>
          <h2 id="confirmar-borrado-titulo" data-confirmar-titulo>Eliminar</h2>
        </div><button class="modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
      </div>
      <div class="confirmar-cuerpo" id="confirmar-borrado-detalle">
        <p data-confirmar-mensaje></p>
        <div class="confirmar-cascada" data-confirmar-cascada hidden>
          <p class="confirmar-cascada-titulo">También se eliminará:</p>
          <ul data-confirmar-lista></ul>
        </div>
        <div class="confirmar-desasociar" data-confirmar-desasociar hidden>
          <p class="confirmar-desasociar-titulo">No se eliminará, pero:</p>
          <ul data-confirmar-lista-desasociar></ul>
        </div>
        <div class="confirmar-reasignar" data-confirmar-reasignar hidden>
          <p class="confirmar-reasignar-titulo" data-confirmar-reasignar-titulo></p>
          <ul data-confirmar-lista-reasignar></ul>
          <label class="confirmar-destino">
            <span data-confirmar-destino-etiqueta>Reasignar a</span>
            <select data-confirmar-destino></select>
          </label>
          <p class="confirmar-destino-error" data-confirmar-destino-error hidden></p>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" data-modal-close>Cancelar</button>
        <button class="btn btn-danger" type="button" data-confirmar-aceptar>Sí, eliminar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="js/conexion_html.js"></script>
  <script src="js/conexion/clientes_bd.js"></script>
  <script src="js/conexion/clinica_bd.js"></script>
  <script src="js/conexion/catalogo_bd.js"></script>
  <script src="js/conexion/inventario_bd.js"></script>
  <script src="js/conexion/ventas_bd.js"></script>
  <script src="js/conexion/personal_bd.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

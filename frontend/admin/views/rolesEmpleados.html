<section class="roles-empleados">

    <!-- =====================================
         CABECERA
    ====================================== -->

    <div class="roles-empleados-header">

        <div>

            <h2>Panel de Administración - Roles de Empleados</h2>

            <p>
                Gestión de los roles asignados al personal de la veterinaria
            </p>

        </div>

        <span class="fecha-roles-empleados">
            Septiembre 2026
        </span>

    </div>


    <!-- =====================================
         BARRA DE HERRAMIENTAS
    ====================================== -->

    <div class="roles-empleados-toolbar">

        <!-- BOTÓN AGREGAR -->

        <button class="btn-agregar-rol-empleado" id="btnAgregarRolEmpleado">

            <span>+</span>

            Añadir Rol

        </button>


        <!-- BUSCADOR -->

        <div class="buscador-roles-empleados">

            <span class="icono-busqueda-roles-empleados">
                ⌕
            </span>

            <input type="text" id="buscarRolEmpleado" placeholder="Filtrar por nombre del rol...">

        </div>


        <!-- PAGINACIÓN -->

        <div class="paginacion-roles-empleados">

            <span>

                1 - 25 de

                <strong id="totalRolesEmpleados">
                    8
                </strong>

                Roles

            </span>


            <button class="btn-paginacion-rol-empleado" id="paginaAnteriorRolEmpleado">
                ‹
            </button>


            <button class="btn-paginacion-rol-empleado" id="paginaSiguienteRolEmpleado">
                ›
            </button>

        </div>

    </div>


    <!-- =====================================
         TABLA
    ====================================== -->

    <div class="tabla-roles-empleados-container">

        <table class="tabla-roles-empleados">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Rol de Empleado</th>

                    <th>Acciones</th>

                </tr>

            </thead>


            <tbody id="tablaRolesEmpleados">

            </tbody>

        </table>

    </div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <div class="roles-empleados-footer">

        <span>

            <strong id="rolesEmpleadosRegistrados">
                8
            </strong>

            Roles Registrados

        </span>

    </div>

</section>

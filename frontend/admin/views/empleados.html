<section class="empleados">

    <!-- =====================================
         CABECERA
    ====================================== -->

    <div class="empleados-header">

        <div>

            <h2>Panel de Administración - Empleados</h2>

            <p>
                Gestión del personal de la veterinaria
            </p>

        </div>

        <span class="fecha-empleados">
            Septiembre 2026
        </span>

    </div>


    <!-- =====================================
         BARRA DE HERRAMIENTAS
    ====================================== -->

    <div class="empleados-toolbar">

        <!-- BOTÓN AGREGAR -->

        <button class="btn-agregar-empleado" id="btnAgregarEmpleado">

            <span>+</span>

            Añadir Empleado

        </button>


        <!-- BUSCADOR -->

        <div class="buscador-empleados">

            <span class="icono-busqueda-empleados">
                ⌕
            </span>

            <input type="text" id="buscarEmpleado" placeholder="Filtrar por nombre, apellido o rol...">

        </div>


        <!-- FILTRO POR ROL -->

        <div class="filtro-rol-empleados">

            <select id="filtroRolEmpleado">

                <option value="">
                    Todos los roles
                </option>

                <option value="veterinario">
                    Veterinario
                </option>

                <option value="recepcionista">
                    Recepcionista
                </option>

                <option value="administrador">
                    Administrador
                </option>

                <option value="asistente">
                    Asistente
                </option>

            </select>

        </div>


        <!-- PAGINACIÓN -->

        <div class="paginacion-empleados">

            <span>

                1 - 25 de

                <strong id="totalEmpleados">
                    50
                </strong>

                Empleados

            </span>


            <button class="btn-paginacion-empleados" id="paginaAnteriorEmpleado">
                ‹
            </button>


            <button class="btn-paginacion-empleados" id="paginaSiguienteEmpleado">
                ›
            </button>

        </div>

    </div>


    <!-- =====================================
         TABLA
    ====================================== -->

    <div class="tabla-empleados-container">

        <table class="tabla-empleados">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Empleado</th>

                    <th>Rol</th>

                    <th>Teléfono</th>

                    <th>Sucursal</th>

                    <th>Acciones</th>

                </tr>

            </thead>


            <tbody id="tablaEmpleados">

            </tbody>

        </table>

    </div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <div class="empleados-footer">

        <span>

            <strong id="empleadosRegistrados">
                50
            </strong>

            Empleados Registrados

        </span>

    </div>

</section>

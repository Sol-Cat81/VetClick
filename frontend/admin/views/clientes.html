<section>
  <div class="page-head">
    <div>
      <h1>Clientes</h1>
      <p>Gestión de propietarios, mascotas y direcciones</p>
    </div>
    <div class="page-date">3 clientes registrados · datos demo</div>
  </div>
  <div class="subnav">
    <button class="active" data-section="clientes">Clientes</button><button
      data-section="mascotas">Mascotas</button><button data-section="direcciones">Direcciones</button>
  </div>

  <div data-panel="clientes">
    <div class="toolbar">
      <div class="filter-box">⌕ <input data-table-filter="#clientes-table"
          placeholder="Filtrar por nombre, apellido o teléfono..."></div><button class="btn btn-primary"
        data-toast="Formulario de cliente listo para conectar">＋ Añadir cliente</button>
    </div>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="clientes-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaClientes">
           
          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="mascotas" hidden>
    <div class="toolbar">
      <div class="filter-box">⌕ <input data-table-filter="#mascotas-table" placeholder="Buscar mascota, propietario...">
      </div><button class="btn btn-primary" data-toast="Formulario de mascota listo para conectar">＋ Añadir
        mascota</button>
    </div>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="mascotas-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Propietario</th>
              <th>Especie</th>
              <th>Raza</th>
              <th>Sexo</th>
              <th>Peso</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="direcciones" hidden>
    <div class="toolbar">
      <div class="filter-box">⌕ <input data-table-filter="#direcciones-table"
          placeholder="Filtrar por cliente, dirección, localidad o código postal..."></div><button
        class="btn btn-primary" data-toast="Formulario de dirección listo para conectar">＋ Añadir
        dirección</button>
    </div>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="direcciones-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Tipo</th>
              <th>Dirección</th>
              <th>Localidad</th>
              <th>C.P.</th>
              <th>Referencia</th>
            </tr>
          </thead>
          <tbody id="tablaDirecciones">

          </tbody>
        </table>
      </div>
    </article>
  </div>
</section>

<section class="clientes">

    <!-- =====================================
         CABECERA
    ====================================== -->

    <div class="clientes-header">

        <div>
            <h2>Panel de Administración - Clientes</h2>

            <p>
                Gestión de propietarios y sus mascotas
            </p>
        </div>

        <span class="fecha-clientes">
            Septiembre 2026
        </span>

    </div>


    <!-- =====================================
         BARRA DE HERRAMIENTAS
    ====================================== -->

    <div class="clientes-toolbar">

        <button class="btn-agregar-cliente" id="btnAgregarCliente">

            <span>+</span>

            Añadir Cliente

        </button>


        <div class="buscador-clientes">

            <span class="icono-busqueda">⌕</span>

            <input type="text" id="buscarCliente" placeholder="Filtrar por nombre o email...">

        </div>


        <div class="paginacion">

            <span>
                1 - 25 de
                <strong id="totalClientes">
                    150
                </strong>
                Clientes
            </span>

            <button class="btn-paginacion" id="paginaAnterior">
                ‹
            </button>

            <button class="btn-paginacion" id="paginaSiguiente">
                ›
            </button>

        </div>

    </div>


    <!-- =====================================
         TABLA CLIENTES
    ====================================== -->

    <div class="tabla-clientes-container">

        <table class="tabla-clientes">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Nombre</th>

                    <th>Apellido</th>

                    <th>Email</th>

                    <th>Teléfono</th>

                    <th>Estado</th>

                    <th>Acciones</th>

                </tr>

            </thead>


            <tbody id="tablaClientes">
                
            </tbody>

        </table>

    </div>


    <!-- =====================================
         PIE DE TABLA
    ====================================== -->

    <div class="clientes-footer">

        <span>
            <strong id="clientesRegistrados">
                150
            </strong>
            Clientes Registrados
        </span>

    </div>

</section>

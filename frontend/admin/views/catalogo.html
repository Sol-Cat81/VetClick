<section>
  <div class="page-head">
    <div>
      <h1>Catálogo</h1>
      <p>Productos, categorías, marcas y variantes</p>
    </div>
    <div class="page-date">Catálogo comercial</div>
  </div>
  <div class="subnav">
    <button class="active" data-section="productos">Productos</button><button
      data-section="categorias">Categorías</button><button data-section="marcas">Marcas</button><button
      data-section="variantes">Variantes</button>
  </div>

  <div data-panel="productos">
    <div class="toolbar">
      <div class="filter-box">⌕ <input placeholder="Buscar producto..."></div><button class="btn btn-primary"
        data-toast="Formulario de producto listo para conectar">＋ Añadir producto</button>
    </div>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="productos-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Marca</th>
              <th>Descripción</th>
              <th>Descuento</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="categorias" hidden>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="categorias-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Categoría</th>
              <th>Categoría padre</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="marcas" hidden>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="marcas-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Marca</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="variantes" hidden>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="variantes-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Precio</th>
              <th>Stock base</th>
              <th>Atributo</th>
            </tr>
          </thead>
          <tbody>
            
          </tbody>
        </table>
      </div>
    </article>
  </div>
</section>

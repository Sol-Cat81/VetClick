<section class="usuarios">

    <!-- =====================================
         CABECERA
    ====================================== -->

    <div class="usuarios-header">

        <div>

            <h2>Panel de Administración - Usuarios</h2>

            <p>
                Gestión de usuarios y permisos de acceso al sistema
            </p>

        </div>

        <span class="fecha-usuarios">
            Septiembre 2026
        </span>

    </div>


    <!-- =====================================
         BARRA DE HERRAMIENTAS
    ====================================== -->

    <div class="usuarios-toolbar">

        <!-- BOTÓN AGREGAR -->

        <button class="btn-agregar-usuario" id="btnAgregarUsuario">

            <span>+</span>

            Añadir Usuario

        </button>


        <!-- BUSCADOR -->

        <div class="buscador-usuarios">

            <span class="icono-busqueda-usuarios">
                ⌕
            </span>

            <input type="text" id="buscarUsuario" placeholder="Filtrar por usuario o email...">

        </div>


        <!-- FILTRO ESTADO -->

        <div class="filtro-estado-usuarios">

            <select id="filtroEstadoUsuario">

                <option value="">
                    Todos los estados
                </option>

                <option value="activo">
                    Activos
                </option>

                <option value="inactivo">
                    Inactivos
                </option>

            </select>

        </div>


        <!-- PAGINACIÓN -->

        <div class="paginacion-usuarios">

            <span>

                1 - 25 de

                <strong id="totalUsuarios">
                    50
                </strong>

                Usuarios

            </span>


            <button class="btn-paginacion-usuario" id="paginaAnteriorUsuario">
                ‹
            </button>


            <button class="btn-paginacion-usuario" id="paginaSiguienteUsuario">
                ›
            </button>

        </div>

    </div>


    <!-- =====================================
         TABLA
    ====================================== -->

    <div class="tabla-usuarios-container">

        <table class="tabla-usuarios">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Usuario</th>

                    <th>Email</th>

                    <th>Rol</th>

                    <th>Estado</th>

                    <th>Acciones</th>

                </tr>

            </thead>


            <tbody id="tablaUsuarios">
            </tbody>
        </table>
    </div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <div class="usuarios-footer">

        <span>

            <strong id="usuariosRegistrados">
                50
            </strong>

            Usuarios Registrados

        </span>

    </div>

</section>

<section>
  <div class="page-head">
    <div>
      <h1>Inventario</h1>
      <p>Control de stock y sucursales</p>
    </div>
    <div class="page-date">5 registros de inventario demo</div>
  </div>
  <div class="subnav"><button class="active" data-section="stock">Stock</button><button
      data-section="sucursales">Sucursales</button></div>

  <div data-panel="stock">
    <div class="toolbar">
      <div class="filter-box">⌕ <input placeholder="Buscar producto o sucursal..."></div><button
        class="btn btn-secondary" data-toast="Ajuste de stock preparado">Ajustar stock</button>
    </div>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="stock-table">
          <thead>
            <tr>
              <th>Producto / variante</th>
              <th>Sucursal</th>
              <th>Stock actual</th>
              <th>Stock mínimo</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="sucursales" hidden>
    <div class="detail-grid" id="sucursales-list">
      <article class="card info-card">

      </article>
    </div>
  </div>

  <div class="modal-backdrop" data-admin-modal="registro de stock">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="stock-modal-title">
      <div class="modal-head">
        <div><span class="modal-kicker">Inventario</span>
          <h2 id="stock-modal-title" data-modal-title>Ajustar registro de stock</h2>
        </div><button class="modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
      </div>
      <form data-admin-modal-form>
        <div class="modal-fields"><label>Producto / variante<input data-modal-field name="variante_busqueda"
              list="stock-variantes" data-relation="variantes" data-relation-field="id_variante"
              autocomplete="off" required><datalist id="stock-variantes"></datalist></label>
          <input type="hidden" name="id_variante" data-relation-value="id_variante">
          <label>Sucursal<input data-modal-field name="sucursal_busqueda" list="stock-sucursales"
              data-relation="sucursales" data-relation-field="id_sucursal" autocomplete="off" required>
            <datalist id="stock-sucursales"></datalist></label>
          <input type="hidden" name="id_sucursal" data-relation-value="id_sucursal">
          <label>Stock actual<input data-modal-field name="stock_actual" type="number" min="0" required></label>
          <label>Stock mínimo<input data-modal-field name="stock_minimo" type="number" min="0"></label></div>
        <div class="modal-actions"><button class="btn btn-secondary" type="button"
            data-modal-close>Cancelar</button><button class="btn btn-primary" type="submit">Guardar stock</button></div>
      </form>
    </div>
  </div>
  <div class="modal-backdrop" data-admin-modal="sucursal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sucursal-modal-title">
      <div class="modal-head">
        <div><span class="modal-kicker">Inventario</span>
          <h2 id="sucursal-modal-title" data-modal-title>Agregar sucursal</h2>
        </div><button class="modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
      </div>
      <form data-admin-modal-form>
        <div class="modal-fields"><label>Nombre<input data-modal-field name="nombre" required></label>
          <label>Dirección<input data-modal-field name="direccion"></label>
          <label>Localidad<input data-modal-field name="localidad"></label>
          <label>Teléfono<input data-modal-field name="telefono"></label>
          <label>Horario<input data-modal-field name="horario"></label>
          <label>Estado<select data-modal-field name="activo"><option value="true">Activa</option>
              <option value="false">Inactiva</option></select></label></div>
        <div class="modal-actions"><button class="btn btn-secondary" type="button"
            data-modal-close>Cancelar</button><button class="btn btn-primary" type="submit">Guardar sucursal</button>
        </div>
      </form>
    </div>
  </div>
</section>

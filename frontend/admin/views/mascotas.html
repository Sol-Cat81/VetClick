<section class="mascotas">

    <!--CABECERA -->

    <div class="mascotas-header">
        <div>
            <h2>Panel de Administración - Mascotas</h2>
            <p>
                Gestión de mascotas y sus propietarios
            </p>
        </div>
        <span class="fecha-mascotas">
            Septiembre 2026
        </span>
    </div>

    <!-- BARRA DE HERRAMIENTAS-->

    <div class="mascotas-toolbar">
        <button class="btn-agregar-mascota" id="btnAgregarMascota">
            <span>+</span>
            Añadir Mascota
        </button>
        <div class="buscador-mascotas">
            <span class="icono-busqueda-mascota">
                ⌕
            </span>
            <input type="text" id="buscarMascota" placeholder="Filtrar por nombre, especie o propietario...">
        </div>
        <div class="filtro-especie">
            <select id="filtroEspecie">
                <option value="">
                    Todas las especies
                </option>
                <option value="perro">
                    Perros
                </option>
                <option value="gato">
                    Gatos
                </option>
                <option value="ave">
                    Aves
                </option>
                <option value="otro">
                    Otros
                </option>
            </select>
        </div>

        <div class="paginacion-mascotas">
            <span>1 - 25 de
                <strong id="totalMascotas">
                    150
                </strong>
                Mascotas
            </span>
            <button class="btn-paginacion-mascota" id="paginaAnteriorMascota">‹</button>
            <button class="btn-paginacion-mascota" id="paginaSiguienteMascota">›</button>
        </div>
    </div>
    <!--TABLA-->
    <div class="tabla-mascotas-container">
        <table class="tabla-mascotas">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mascota</th>
                    <th>Especie</th>
                    <th>Raza</th>
                    <th>Sexo</th>
                    <th>Fecha nacimiento</th>
                    <th>Peso</th>
                    <th>Propietario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaMascotas">
            </tbody>
        </table>
    </div>

    <!--PIE-->
    <div class="mascotas-footer">
        <span>
            <strong id="mascotasRegistradas">
                150
            </strong>
            Mascotas Registradas
        </span>
    </div>
</section>

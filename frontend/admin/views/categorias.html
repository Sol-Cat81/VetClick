<section class="categorias">
  <div class="categorias-header">
    <div>
      <h2>Panel de Administración - Categorías</h2>
      <p>Gestión de categorías de productos</p>
    </div>
    <span class="fecha-categorias">Septiembre 2026</span>
  </div>
  <div class="categorias-toolbar">
    <button class="btn-agregar-categoria" id="btnAgregarCategoria">
      <span>+</span> Añadir Categoría
    </button>
    <div class="buscador-categorias">
      <span class="icono-busqueda-categoria">⌕</span
      ><input
        type="text"
        id="buscarCategoria"
        placeholder="Filtrar por nombre..."
      />
    </div>
    <div class="paginacion-categorias">
      <span>1 - 25 de <strong id="totalCategorias">12</strong> Categorías</span
      ><button class="btn-paginacion-categoria" id="paginaAnteriorCategoria">
        ‹</button
      ><button class="btn-paginacion-categoria" id="paginaSiguienteCategoria">
        ›
      </button>
    </div>
  </div>
  <div class="tabla-categorias-container">
    <table class="tabla-categorias">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre de la categoría</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaCategorias">
        <tr>
          <td>1</td>
          <td>Alimentos</td>
          <td class="acciones-categoria">
            <button class="btn-editar-categoria" title="Editar categoría">
              ✎</button
            ><button class="btn-eliminar-categoria" title="Eliminar categoría">
              🗑
            </button>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>Higiene y salud</td>
          <td class="acciones-categoria">
            <button class="btn-editar-categoria" title="Editar categoría">
              ✎</button
            ><button class="btn-eliminar-categoria" title="Eliminar categoría">
              🗑
            </button>
          </td>
        </tr>
        <tr>
          <td>3</td>
          <td>Juguetes</td>
          <td class="acciones-categoria">
            <button class="btn-editar-categoria" title="Editar categoría">
              ✎</button
            ><button class="btn-eliminar-categoria" title="Eliminar categoría">
              🗑
            </button>
          </td>
        </tr>
        <tr>
          <td>4</td>
          <td>Accesorios</td>
          <td class="acciones-categoria">
            <button class="btn-editar-categoria" title="Editar categoría">
              ✎</button
            ><button class="btn-eliminar-categoria" title="Eliminar categoría">
              🗑
            </button>
          </td>
        </tr>
        <tr>
          <td>5</td>
          <td>Camas y descanso</td>
          <td class="acciones-categoria">
            <button class="btn-editar-categoria" title="Editar categoría">
              ✎</button
            ><button class="btn-eliminar-categoria" title="Eliminar categoría">
              🗑
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="categorias-footer">
    <strong id="categoriasRegistradas">12</strong> Categorías Registradas
  </div>
</section>

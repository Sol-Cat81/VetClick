<section>
  <div class="page-head">
    <div>
      <h1>Ventas</h1>
      <p>Pedidos, pagos y envíos</p>
    </div>
    <div class="page-date">2 pedidos registrados · datos demo</div>
  </div>
  <div class="subnav"><button class="active" data-section="pedidos">Pedidos</button><button
      data-section="pagos">Pagos</button><button data-section="envios">Envíos</button></div>

  <div data-panel="pedidos">
    <div class="toolbar">
      <div class="filter-box">⌕ <input placeholder="Buscar pedido o cliente..."></div><button class="btn btn-primary"
        data-toast="Nuevo pedido preparado para conectar">＋ Nuevo pedido</button>
    </div>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="pedidos-table">
          <thead>
            <tr>
              <th>Pedido</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Subtotal</th>
              <th>Envío</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="pagos" hidden>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="pagos-table">
          <thead>
            <tr>
              <th>Pago</th>
              <th>Pedido</th>
              <th>Método</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div data-panel="envios" hidden>
    <article class="card table-card">
      <div class="table-wrap">
        <table id="envios-table">
          <thead>
            <tr>
              <th>Envío</th>
              <th>Pedido</th>
              <th>Tipo</th>
              <th>C.P.</th>
              <th>Fecha estimada</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>

          </tbody>
        </table>
      </div>
    </article>
  </div>

  <div class="modal-backdrop" data-admin-modal="pedido">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pedido-modal-title">
      <div class="modal-head">
        <div><span class="modal-kicker">Ventas</span>
          <h2 id="pedido-modal-title" data-modal-title>Agregar pedido</h2>
        </div><button class="modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
      </div>
      <form data-admin-modal-form>
        <div class="modal-fields"><label>Cliente<input data-modal-field name="cliente_busqueda" list="pedido-clientes"
              data-relation="clientes" data-relation-field="id_cliente" autocomplete="off" required>
            <datalist id="pedido-clientes"></datalist></label>
          <input type="hidden" name="id_cliente" data-relation-value="id_cliente">
          <label>Artículo del pedido<input data-modal-field name="variante_busqueda" list="pedido-variantes"
              data-relation="variantes" data-relation-field="id_variante" autocomplete="off" required>
            <datalist id="pedido-variantes"></datalist></label>
          <input type="hidden" name="id_variante" data-relation-value="id_variante">
          <label>Cantidad<input data-modal-field name="cantidad" type="number" min="1" value="1" required></label>
          <label>Fecha<input data-modal-field name="fecha" type="datetime-local"></label>
          <label>Estado<select data-modal-field name="estado">
              <option value="PENDIENTE">Pendiente</option>
              <option value="PREPARANDO">Preparando</option>
              <option value="ENVIADO">Enviado</option>
              <option value="ENTREGADO">Entregado</option>
            </select></label><label>Envío<input data-modal-field name="costo_envio" type="number"
              step="0.01" value="0"></label>
        </div>
        <div class="modal-actions"><button class="btn btn-secondary" type="button"
            data-modal-close>Cancelar</button><button class="btn btn-primary" type="submit">Guardar pedido</button>
        </div>
      </form>
    </div>
  </div>
  <div class="modal-backdrop" data-admin-modal="pago">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pago-modal-title">
      <div class="modal-head">
        <div><span class="modal-kicker">Ventas</span>
          <h2 id="pago-modal-title" data-modal-title>Agregar pago</h2>
        </div><button class="modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
      </div>
      <form data-admin-modal-form>
        <div class="modal-fields"><label>Pedido<input data-modal-field name="pedido_busqueda" list="pago-pedidos"
              data-relation="pedidos" data-relation-field="id_pedido" autocomplete="off" required>
            <datalist id="pago-pedidos"></datalist></label>
          <input type="hidden" name="id_pedido" data-relation-value="id_pedido">
          <label>Método<select data-modal-field name="metodo_pago" required>
              <option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option>
              <option value="DEBITO">Débito</option><option value="CREDITO">Crédito</option>
            </select></label><label>Estado<select data-modal-field name="estado_pago">
              <option value="PENDIENTE">Pendiente</option><option value="REALIZADO">Realizado</option>
            </select></label></div>
        <div class="modal-actions"><button class="btn btn-secondary" type="button"
            data-modal-close>Cancelar</button><button class="btn btn-primary" type="submit">Guardar pago</button></div>
      </form>
    </div>
  </div>
  <div class="modal-backdrop" data-admin-modal="envío">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="envio-modal-title">
      <div class="modal-head">
        <div><span class="modal-kicker">Ventas</span>
          <h2 id="envio-modal-title" data-modal-title>Agregar envío</h2>
        </div><button class="modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
      </div>
      <form data-admin-modal-form>
        <div class="modal-fields"><label>Pedido<input data-modal-field name="pedido_busqueda" list="envio-pedidos"
              data-relation="pedidos" data-relation-field="id_pedido" autocomplete="off" required>
            <datalist id="envio-pedidos"></datalist></label>
          <input type="hidden" name="id_pedido" data-relation-value="id_pedido">
          <label>Tipo<select data-modal-field name="tipo_entrega" required>
              <option value="DOMICILIO">Domicilio</option><option value="SUCURSAL">Sucursal</option>
              <option value="PROGRAMADO">Programado</option>
            </select></label>
          <label>Dirección<input data-modal-field name="direccion_busqueda" list="envio-direcciones"
              data-relation="direcciones" data-relation-field="id_direccion" autocomplete="off">
            <datalist id="envio-direcciones"></datalist></label>
          <input type="hidden" name="id_direccion" data-relation-value="id_direccion">
          <label>C.P.<input data-modal-field name="codigo_postal"></label>
          <label>Fecha estimada<input data-modal-field name="fecha_estimada" type="date"></label>
          <label>Estado<select data-modal-field name="estado"><option value="EN_CAMINO">En camino</option>
              <option value="ENTREGADO">Entregado</option></select></label></div>
        <div class="modal-actions"><button class="btn btn-secondary" type="button"
            data-modal-close>Cancelar</button><button class="btn btn-primary" type="submit">Guardar envío</button></div>
      </form>
    </div>
  </div>
</section>

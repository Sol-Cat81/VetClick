<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/icons/ChatGPT-Image-Logo.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    <link rel="stylesheet" href="../css/catalogo.css" />
    <title>VetClick - Catalogo</title>
</head>

<body>
    <mi-navbar ruta-base="../" pagina-actual="carrito"></mi-navbar>

    <main class="container-xl">
        <section id="catalogo-hero">
            <img src="../assets/img/ChatGPT-Image-catalogo.png" alt="">
        </section>

        <div class="contenido">
            <aside class="filtros">
                <div class="conte">
                    <div class="header-filtros">
                        <h6>Filtros</h6>
                        <i class="ph-bold ph-x cerrar"></i>
                    </div>
                    <span class="sideye">Precio</span>
                    <div class="rango-precios">
                        <div>
                            <label for="">Min:</label>
                            <input type="number" name="min" id="minimo" value="0">
                        </div>
                        <span> - </span>
                        <div>
                            <label for="">Max:</label>
                            <input type="number" name="max" id="maximo" value="0">
                        </div>
                    </div>
                    <div class="slider-container">
                        <div class="slider-track"></div>
                        <input type="range" id="minRange" min="1000" max="50000" value="1000" step="500">
                        <input type="range" id="maxRange" min="1000" max="50000" value="50000" step="500">
                    </div>
                    <details>
                        <summary>
                            Categorias
                            <i class="ph-bold ph-caret-right"></i>
                        </summary>
                        <ul id="lista-categorias" class="lista-filtros"></ul>
                    </details>
                    <details>
                        <summary>
                            Marcas
                            <i class="ph-bold ph-caret-right"></i>
                        </summary>
                        <ul id="lista-marcas" class="lista-filtros"></ul>
                    </details>
                </div>
            </aside>
            <div class="contenedor">
                <section class="barra">
                    <div class="contador">
                        (<span id="contador-productos">0</span>) productos
                    </div>
                    <button class="btn menu-filtros">
                        <i class="ph-bold ph-faders"></i>
                        Filtros
                    </button>
                </section>
                <section class="productos">
                </section>
                <nav id="paginacion" aria-label="Paginación de productos"></nav>
            </div>
        </div>
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
            <div id="miToast" class="toast align-items-center text-bg-success border-0" role="alert"
                aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body" id="toast-mensaje">¡Operación exitosa!</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
    </main>

    <!-- PIE DE PAGINA -->
    <footer>
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-md-4 justify-content-center">
                    <img src="../assets/icons/ChatGPT-Image-Logo.png" alt="" />
                </div>
                <div class="col-md-4">
                    <h3>Nosotros</h3>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Nosotros</li>
                        <li class="list-group-item">Contacto</li>
                        <li class="list-group-item">Sucursales</li>
                        <li class="list-group-item">Politicas de privacidad</li>
                    </ul>
                </div>
                <div class="col-md-4">
                    <h3>Social</h3>
                    <div class="social">
                        <i class="ph ph-linkedin-logo"></i>
                        <i class="ph ph-instagram-logo"></i>
                        <i class="ph ph-facebook-logo"></i>
                        <i class="ph ph-x-logo"></i>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/navbar.js" defer></script>
    <script src="../js/catalogo.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

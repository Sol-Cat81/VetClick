<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Logo -->
    <link rel="shortcut icon" href="../assets/icons/ChatGPT-Image-Logo.png" type="image/x-icon">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Phosphor icons -->
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    <!-- swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/productos.css">
    <title>VetClick - Shop</title>
</head>

<body>
    <lottie-player class="loader" src="../assets/img/animal.json" background="transparent" speed="1"
        style="width: 300px; height: 300px;" loop autoplay></lottie-player>
    <!-- BARRA DE NAVEGACION -->
    <header>
        <!-- Logo -->
        <div class="logo">
            <a href="../index.html">VetClick</a>
        </div>
        <div class="usuario">
            <i class="ph-thin ph-user"></i>
            <i class="ph-thin ph-shopping-cart-simple"></i>
        </div>
        <nav>
            <ul>
                <li><a href="#hero">Inicio</a></li>
                <li><a href="pages/servicios.html">Servicios</a></li>
                <li><a href="pages/politicas.html">Productos</a></li>
                <li><a href="pages/turnos.html">Turnos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- SECCION HERO (CARRUSEL) -->
        <section id="hero-productos">
            <div class="swiper">
                <!-- Additional required wrapper -->
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide">
                        <img src="../assets/img/carrusel1.png" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="../assets/img/carrusel2.png" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="../assets/img/carrusel2.png" alt="">
                    </div>
                    ...
                </div>
                <!-- If we need pagination -->
                <div class="swiper-pagination"></div>

                <!-- If we need navigation buttons -->
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>

                <!-- If we need scrollbar -->
                <div class="swiper-scrollbar"></div>
            </div>
        </section>

        <div class="container-fluid">
            <div class="row">
                <!-- BARRA LATERAL -->
                <div class="col col-2">
                    <aside>
                        <h3>Productos</h3>
                        <ul class="sidevar">
                            <li></li>
                            <li></li>
                            <li></li>
                            <li></li>
                            <li></li>
                        </ul>
                    </aside>
                </div>
                <div class="col col-10">
                    <section id="productos">
                        sds
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- PIE DE PAGINA -->
    <footer>
        <div class="container">
            <div class="row justify-content-center g-2">
                <div class="col col-4">
                    <img src="../assets/icons/ChatGPT-Image-Logo.png" alt="">
                </div>
                <div class="col col-3">
                    <h3>Nosotros</h3>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Nosotros</li>
                        <li class="list-group-item">Contacto</li>
                        <li class="list-group-item">Sucursales</li>
                        <li class="list-group-item">Politicas de privacidad</li>
                    </ul>
                </div>
                <div class="col col-3">
                    <h3>Social</h3>
                    <div class="social">
                        <i class="ph ph-linkedin-logo"></i>
                        <i class="ph ph-instagram-logo"></i>
                        <i class="ph ph-facebook-logo"></i>
                        <i class="ph ph-x-logo"></i>
                    </div>
                </div>
            </div>

        </div>
    </footer>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <!-- Anime js -->
    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>

    <!-- Pre-loader -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <script src="../js/main.js"></script>
    <script src="../js/productos.js"></script>
</body>

</html>
